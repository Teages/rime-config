# Rime schema
# encoding: utf-8
#
# 薄荷拼音精簡版——基於 oh-my-rime 的 rime_mint 方案精簡而來。
# 保留：全拼、英文混輸、Emoji、簡繁切換、拆字反查、錯音提示
# 移除：日期時間、農曆、計算器、聲調顯示、五筆反查、筆畫反查等

schema:
  schema_id: rime_mint_lite
  name: 薄荷拼音精簡版
  version: 0.1.0
  author:
    - mintimate <@Mintimate>
  description: |
    基於薄荷拼音的全拼輸入方案（精簡版）。
    參考：
      * rime wiki: https://github.com/rime/home/wiki
      * rime ice: https://github.com/iDvel/rime-ice
      * oh-my-rime: https://github.com/Mintimate/oh-my-rime
  dependencies:
    - radical_pinyin
    - melt_eng

switches:
  - name: emoji_suggestion
    states: [😣️, 😁️]
    reset: 1
  - name: full_shape
    states: [半角, 全角]
    reset: 0
  - name: transcription
    states: [简体, 繁体]
    reset: 0
  - name: ascii_punct
    states: [。，, ．，]
    reset: 0

engine:
  processors:
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - matcher
    - affix_segmentor@radical_reverse_lookup
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - table_translator@melt_eng
    - reverse_lookup_translator@radical_reverse_lookup
    - lua_translator@*force_gc
  filters:
    - lua_filter@*corrector_filter
    - simplifier@emoji_suggestion
    - simplifier@transcription_cc
    - lua_filter@*reduce_english_filter
    - uniquifier

# 簡繁切換
transcription_cc:
  option_name: transcription
  opencc_config: s2t.json
  tips: none
  excluded_types: [reverse_lookup]

# Emoji
emoji_suggestion:
  opencc_config: emoji.json
  option_name: emoji_suggestion
  tips: all
  inherit_comment: false

# Lua: 降低部分英語單詞在候選項的位置

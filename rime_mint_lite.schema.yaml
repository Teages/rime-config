# 語法模型
grammar:
  language: wanxiang-lts-zh-hans
  collocation_max_length: 8
  collocation_min_length: 2
  collocation_penalty: -10
  non_collocation_penalty: -20
  weak_collocation_penalty: -35
  rear_penalty: -12

# 主翻譯器
translator:
  dictionary: rime_mint_lite
  enable_word_completion: true
  spelling_hints: 8
  always_show_comments: true
  contextual_suggestions: false
  max_homophones: 5
  max_homographs: 5
  comment_format:
    - xform/^/〔/
    - xform/$/〕/
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/
  initial_quality: 1.2
  enable_user_dict: true

# 英文輸入
melt_eng:
  dictionary: melt_eng
  enable_sentence: false
  enable_completion: false
  initial_quality: 1.0
  comment_format:
    - xform/.*//

# 拆字反查
radical_reverse_lookup:
  tag: radical_lookup
  dictionary: radical_pinyin
  enable_completion: false
  enable_sentence: false
  prefix: Uu
  tips: 〔拆字〕

reverse_lookup:
  tags: [radical_lookup]
  overwrite_comment: true
  dictionary: rime_mint_lite

# 標點符號
punctuator:
  import_preset: symbols
  half_shape:
    '#': '#'
    '*': '*'
    .: {commit: 。}
    '`': '`'
    '~': '~'
    '@': '@'
    =: =
    /: [/, ÷]
    '\': 、
    _: ──
    "'": {pair: [「, 」]}
    '[': [【, '[']
    ']': [】, ']']
    $: [¥, $, €, £, ¢, ¤]
    <: [《, 〈, «, <]
    '>': [》, 〉, », '>']

# 反查與特殊輸入識別
recognizer:
  import_preset: default
  patterns:
    url: '^[a-z]+[.].+$'
    punct: '^/([0-9]0?|[a-zA-Z]+)$'
    radical_lookup: "Uu[a-z]*'?$"
    uppercase: ''

# 快捷鍵
key_binder:
  import_preset: default
  bindings:
    - {accept: 'Control+Shift+E', toggle: emoji_suggestion, when: always}
    - {accept: 'Control+Shift+1', toggle: transcription, when: has_menu}
    - {accept: 'Control+Shift+exclam', toggle: transcription, when: has_menu}

# 候選詞數量
menu:
  page_size: 5

# 拼寫設定
speller:
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  delimiter: ' `'
  algebra:
    # 萬象詞庫帶聲調拼音轉換
    - xlit/āáǎàōóǒòēéěèīíǐìūúǔùǖǘǚǜü/aaaaooooeeeeiiiiuuuuvvvvv/
    - xform/^ng$/eng/
    - xform/ńg|ňg|ǹg/eng/
    - xform/ń|ň|ǹ/en/
    - erase/^xx$/
    # 自動糾錯
    - derive/([aeiou])ng$/$1gn/
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/
    - derive/ong$/on/
    - derive/un$/ong/
    # 簡拼
    - derive/^([zcs]h).+$/$1/
    - abbrev/^([a-z]).+$/$1/
    # zh、ch、sh 糾錯
    - derive/([zcs])h(a|e|i|u|ai|ei|an|en|ou|uo|ua|un|ui|uan|uai|uang|ang|eng|ong)$/h$1$2/
    - derive/([zcs])h([aeiu])$/$1$2h/
    # ai
    - derive/^([wghk])ai$/$1ia/
    # ia
    - derive/([qjx])ia$/$1ai/
    # ei
    - derive/([wtfghkz])ei$/$1ie/
    # ie
    - derive/([jqx])ie$/$1ei/
    # ao
    - derive/([rtypsdghklzcbnm])ao$/$1oa/
    # ou
    - derive/([ypfm])ou$/$1uo/
    # ang
    - derive/([wrtypsdfghklzcbnm])ang$/$1nag/
    - derive/([wrtypsdfghklzcbnm])ang$/$1agn/
    # eng
    - derive/([wrtpsdfghklzcbnm])eng$/$1neg/
    - derive/([wrtpsdfghklzcbnm])eng$/$1egn/
    # ing
    - derive/([qtypdjlxbnm])ing$/$1nig/
    - derive/([qtypdjlxbnm])ing$/$1ign/
    # ong
    - derive/([rtysdghklzcn])ong$/$1nog/
    - derive/([rtysdghklzcn])ong$/$1ogn/
    # iao
    - derive/([qtpdjlxbnm])iao$/$1ioa/
    - derive/([qtpdjlxbnm])iao$/$1oia/
    # ui
    - derive/([rtsghkzc])ui$/$1iu/
    # iu
    - derive/([qjlxnm])iu$/$1ui/
    # ian
    - derive/([qtpdjlxbnm])ian$/$1ain/
    # in
    - derive/([qypjlxbnm])in$/$1ni/
    # iang
    - derive/([qjlxn])iang$/$1aing/
    - derive/([qjlxn])iang$/$1inag/
    # ua
    - derive/([gkh])ua$/$1au/
    # uai
    - derive/([gkh])uai$/$1aui/
    - derive/([gkh])uai$/$1uia/
    # uan
    - derive/([qrtysdghjklzxcn])uan$/$1aun/
    # un
    - derive/([qrtysdghjklzxc])un$/$1nu/
    # ue
    - derive/([nlyjqx])ue$/$1eu/
    # uang
    - derive/([gkh])uang$/$1aung/
    - derive/([gkh])uang$/$1uagn/
    - derive/([gkh])uang$/$1unag/
    - derive/([gkh])uang$/$1augn/
    # iong
    - derive/([jqx])iong$/$1inog/
    - derive/([jqx])iong$/$1oing/
    - derive/([jqx])iong$/$1iogn/
    - derive/([jqx])iong$/$1oign/
    # 其他
    - derive/([rtsdghkzc])o(u|ng)$/$1o/
    - derive/ong$/on/
    - derive/([tl])eng$/$1en/
    - derive/([qwrtypsdfghjklzxcbnm])([aeio])ng$/$1ng/
    - derive/un$/ong/
